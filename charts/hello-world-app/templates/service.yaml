apiVersion: v1
kind: Service
metadata:
  name: hello-world-app
  labels:
    app.kubernetes.io/name: hello-world-app
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: hello-world-app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP