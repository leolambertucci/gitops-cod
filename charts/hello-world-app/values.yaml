nameOverride: hello-world-app
replicaCount: 2
image:
  repository: nginxdemos/hello
  tag: plain-text
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 80
containerPort: 80
readinessProbe:
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
livenessProbe:
  path: /
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
