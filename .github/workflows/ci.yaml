name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validation
        run: |
          cd modules/app
          terraform init -backend=false
          terraform validate

      - name: Setup Terragrunt
        run: |
          wget -O /tmp/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.0/terragrunt_linux_amd64
          chmod +x /tmp/terragrunt
          sudo mv /tmp/terragrunt /usr/local/bin/

      - name: Terragrunt validation
        run: |
          cd envs/dev/app
          terragrunt init
          terragrunt validate

  validate-helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Setup Terragrunt
        run: |
          wget -O /tmp/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.0/terragrunt_linux_amd64
          chmod +x /tmp/terragrunt
          sudo mv /tmp/terragrunt /usr/local/bin/

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Generate Helm values from Terragrunt
        run: |
          set -euo pipefail
          cd envs/dev/app
          terragrunt init >/dev/null
          terragrunt apply -auto-approve -input=false >/dev/null
          terragrunt output -raw helm_values 2>/dev/null | sed -n '/^[[:space:]]*"\?[a-zA-Z0-9_-]\+"\?:/,$p' > /tmp/hello-world-app-values.yaml
          test -s /tmp/hello-world-app-values.yaml
          grep -Eq '^"?service"?:' /tmp/hello-world-app-values.yaml

      - name: Print generated Helm values
        run: |
          echo "--- /tmp/hello-world-app-values.yaml ---"
          cat /tmp/hello-world-app-values.yaml
          echo "--- end ---"

      - name: Helm chart lint
        run: helm lint charts/hello-world-app -f /tmp/hello-world-app-values.yaml
