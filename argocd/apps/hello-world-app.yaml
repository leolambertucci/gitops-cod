---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leolambertucci/gitops-cod.git
    targetRevision: HEAD
    path: charts/hello-world-app
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
